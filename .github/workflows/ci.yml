name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.21'
  POSTGRES_VERSION: '15'

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run go fmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.54.2

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run unit tests
        run: go test ./tests/unit/... -v -race -coverprofile=coverage/unit-coverage.out

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v3
        with:
          name: unit-coverage
          path: coverage/unit-coverage.out

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ env.POSTGRES_VERSION }}-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: internal_transfers_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U user; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done

      - name: Set up test database
        run: |
          PGPASSWORD=password psql -h localhost -U user -d internal_transfers_test -c "
            CREATE TABLE IF NOT EXISTS accounts (
              id SERIAL PRIMARY KEY,
              account_id INTEGER UNIQUE NOT NULL,
              balance DECIMAL(15,5) NOT NULL DEFAULT 0.00000,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
            CREATE TABLE IF NOT EXISTS transactions (
              id SERIAL PRIMARY KEY,
              from_account_id INTEGER REFERENCES accounts(id),
              to_account_id INTEGER REFERENCES accounts(id),
              amount DECIMAL(15,5) NOT NULL,
              description VARCHAR(255),
              status VARCHAR(20) DEFAULT 'pending',
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
              updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
            CREATE INDEX IF NOT EXISTS idx_accounts_account_id ON accounts(account_id);
            CREATE INDEX IF NOT EXISTS idx_transactions_from_account ON transactions(from_account_id);
            CREATE INDEX IF NOT EXISTS idx_transactions_to_account ON transactions(to_account_id);
          "

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://user:password@localhost:5432/internal_transfers_test?sslmode=disable
          RUN_INTEGRATION_TESTS: true
        run: go test ./tests/integration/... -v -race -coverprofile=coverage/integration-coverage.out

      - name: Upload integration test coverage
        uses: actions/upload-artifact@v3
        with:
          name: integration-coverage
          path: coverage/integration-coverage.out

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Download unit test coverage
        uses: actions/download-artifact@v3
        with:
          name: unit-coverage
          path: coverage/

      - name: Download integration test coverage
        uses: actions/download-artifact@v3
        with:
          name: integration-coverage
          path: coverage/

      - name: Combine coverage reports
        run: |
          echo "mode: atomic" > coverage/combined.out
          if [ -f coverage/unit-coverage.out ]; then
            tail -n +2 coverage/unit-coverage.out >> coverage/combined.out
          fi
          if [ -f coverage/integration-coverage.out ]; then
            tail -n +2 coverage/integration-coverage.out >> coverage/combined.out
          fi

      - name: Generate coverage report
        run: |
          go tool cover -html=coverage/combined.out -o coverage/coverage.html
          go tool cover -func=coverage/combined.out > coverage/coverage.txt

      - name: Display coverage summary
        run: |
          echo "Coverage Summary:"
          grep "total:" coverage/coverage.txt || echo "No coverage data found"

      - name: Upload coverage reports
        uses: actions/upload-artifact@v3
        with:
          name: coverage-reports
          path: coverage/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            try {
              const coverage = fs.readFileSync('coverage/coverage.txt', 'utf8');
              const totalLine = coverage.split('\n').find(line => line.includes('total:'));
              if (totalLine) {
                const coveragePercent = totalLine.match(/(\d+\.\d+)%/)[1];
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: `## Test Coverage Report\n\nTotal coverage: **${coveragePercent}%**\n\nDetailed coverage report is available in the CI artifacts.`
                });
              }
            } catch (error) {
              console.log('Could not read coverage file:', error);
            }

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: |
          go build -v -o bin/server ./cmd/server
          ls -la bin/

      - name: Upload binary
        uses: actions/upload-artifact@v3
        with:
          name: application-binary
          path: bin/server

  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: internal-transfers:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download dependencies
        run: go mod download

      - name: Run Gosec Security Scanner
        uses: securecodewarrior/github-action-gosec@master
        with:
          args: '-fmt sarif -out results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: results.sarif

  notification:
    name: Notification
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, build, docker-build]
    if: always()
    steps:
      - name: Notify success
        if: ${{ needs.lint.result == 'success' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.build.result == 'success' && needs.docker-build.result == 'success' }}
        run: echo "✅ All CI checks passed successfully!"

      - name: Notify failure
        if: ${{ needs.lint.result == 'failure' || needs.unit-tests.result == 'failure' || needs.integration-tests.result == 'failure' || needs.build.result == 'failure' || needs.docker-build.result == 'failure' }}
        run: |
          echo "❌ CI checks failed!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Integration Tests: ${{ needs.integration-tests.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"