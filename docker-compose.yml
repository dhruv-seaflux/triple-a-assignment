services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: internal_transfers
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d internal_transfers"]
      interval: 5s
      timeout: 5s
      retries: 5

